apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-api
  namespace: flask-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-api

  template:
    metadata:
      labels:
        app: flask-api

    spec:
      containers:
        - name: flask-api
          image: kubernetes-flask-api:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: flask-api-config
                  key: APP_ENV